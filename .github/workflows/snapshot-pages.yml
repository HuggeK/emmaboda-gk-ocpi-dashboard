# Fetches the latest data from ChargeNode with the OCPI key, builds the static
# dashboard and publishes it to GitHub Pages. Runs every hour (free: the
# repository is public); using the key that often also keeps it alive at
# ChargeNode. The outcome is tracked on an issue: a comment when it
# changes (and daily while failing), a status line in the issue body every run.
name: Snapshot to GitHub Pages

on:
  schedule:
    # Every hour at :17, off the busy top of the hour. GitHub registers a
    # schedule when this file changes on the default branch and may take a
    # while to do so; if scheduled runs stop appearing, re-saving this file
    # (any change) re-registers it. Runs can also be delayed or skipped when
    # GitHub is busy; the status line on the tracking issue shows the last one.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'server/**'
      - 'scripts/**'
      - '.github/**'

permissions:
  actions: write # to keep the scheduled workflows enabled, see the last step
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  TZ: Europe/Stockholm

jobs:
  snapshot:
    name: Fetch data and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/configure-pages@v5
        id: pages

      # Extends the previously published snapshot with the records changed
      # since it was built (a handful of requests to ChargeNode). Once a day,
      # in the 03:xx UTC run, and on manual runs, everything is refetched.
      - name: Build static dashboard from ChargeNode data
        id: build
        env:
          OCPI_TOKEN: ${{ secrets.SECRET_KEY }}
          # E.ON Energidata API (grid meter values) for the Meter tab. Optional;
          # an E.ON failure never fails the run, it shows on the Meter tab.
          EON_CLIENT_ID: ${{ secrets.CLIENTID }}
          EON_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
          SNAPSHOT_BASE_URL: ${{ steps.pages.outputs.base_url }}/data/snapshot.json
        run: |
          full=""
          if [ "$(date -u +%H)" = "03" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then full="--full"; fi
          node scripts/build-snapshot.js --out dist $full

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Since 23 Nov 2026 GitHub's artifact list sometimes lags the upload by a
      # few seconds, and deploy-pages then fails with "No artifacts named
      # github-pages were found" although the upload succeeded. Give the list
      # a moment, and if the first attempt still misses it, wait and retry once.
      - name: Let the artifact list catch up
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment_first
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying the deploy
        if: steps.deployment_first.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment_first.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Deploy result
        id: deployment
        if: always()
        run: |
          echo "page_url=${{ steps.deployment_first.outputs.page_url || steps.deployment_retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          echo "outcome=${{ steps.deployment_first.outcome == 'success' && 'success' || steps.deployment_retry.outcome }}" >> "$GITHUB_OUTPUT"

      - name: Report on the tracking issue
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outputs.outcome }}
          BUILD_RESULT: ${{ steps.build.outputs.result }}
          BUILD_ERROR: ${{ steps.build.outputs.error }}
          KEY_USED: ${{ steps.build.outputs.key_used }}
          GENERATED_AT: ${{ steps.build.outputs.generated_at }}
          OCPI_VERSION: ${{ steps.build.outputs.ocpi_version }}
          EVSES: ${{ steps.build.outputs.evses }}
          CDR_COUNT: ${{ steps.build.outputs.cdr_count }}
          CDR_SINCE: ${{ steps.build.outputs.cdr_since }}
          CDR_FETCHED: ${{ steps.build.outputs.cdr_fetched }}
          INCREMENTAL: ${{ steps.build.outputs.incremental }}
          SESSIONS_30D: ${{ steps.build.outputs.sessions_30d }}
          KWH_30D: ${{ steps.build.outputs.kwh_30d }}
          EON_RESULT: ${{ steps.build.outputs.eon_result }}
          EON_HOURS: ${{ steps.build.outputs.eon_hours }}
          EON_LAST: ${{ steps.build.outputs.eon_last }}
          EON_ERROR: ${{ steps.build.outputs.eon_error }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const report = require('./.github/scripts/report-run.cjs');
            await report({ github, context, core });

      # GitHub switches off scheduled workflows in public repositories after
      # 60 days without activity. Re-enabling them through the API resets that
      # timer, so once a day (the 03:xx UTC run) both scheduled workflows are
      # re-enabled. Never fails the run.
      - name: Keep the scheduled workflows enabled
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" != "03" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then exit 0; fi
          for workflow in snapshot-pages.yml season-reminder.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$workflow/enable" && echo "re-enabled $workflow"
          done

      # The site is published even when ChargeNode refuses the data modules
      # (see scripts/build-snapshot.js), but the run must still show as failed.
      - name: Mark the run failed when ChargeNode refused the data
        if: steps.build.outputs.result != 'ok'
        run: |
          echo "::error::${{ steps.build.outputs.error }}"
          exit 1
