# Reminds the club, two weeks ahead, to ask ChargeNode to switch the load
# balancing for the season (the yearly plan in public/analysis.js, SEASON_PLAN):
#   26 Oct: whole facility ≤ 36 A (≈ 25 kW), the chargers get what is left
#   1 Mar:  chargers ≤ 63 A (43.5 kW) again for the golf season
# Opens an issue assigned to the repository owner with a ready-to-send e-mail.
# Two runs a year, a few seconds each.
name: Season reminder (ChargeNode limit)

on:
  schedule:
    - cron: '0 7 12 10 *' # 12 Oct, two weeks before the winter ceiling
    - cron: '0 7 15 2 *' # 15 Feb, two weeks before the season
  workflow_dispatch:
    inputs:
      switch:
        description: Which switch to remind about
        type: choice
        options: [winter, season]
        default: winter

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          SWITCH: ${{ github.event.inputs.switch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const now = new Date();
            const which = process.env.SWITCH || (now.getUTCMonth() >= 8 ? 'winter' : 'season');
            const year = now.getUTCMonth() >= 8 && which === 'season' ? now.getUTCFullYear() + 1 : now.getUTCFullYear();
            const plan = {
              winter: {
                date: `26 oktober ${year}`,
                title: `Ask ChargeNode to lower the limit to 36 A (≈ 25 kW) for the whole facility from 26 Oct ${year}`,
                mail: [
                  'Hej Jonathan,',
                  '',
                  `Enligt vår plan vill vi från och med den 26 oktober ${year} ställa ned lastbalanseringen till 36 A totalt (≈ 25 kW) för hela anläggningen, som förra vintern.`,
                  'Laddarna ska bara använda det utrymme som resten av anläggningen lämnar under 25 kW, så att de aldrig bidrar till en högre effektavgift under vintern.',
                  '',
                  'Går det att lägga in detta som ett återkommande schema (26 oktober ned till 36 A för hela anläggningen, 1 mars upp till 63 A för laddarna), så att vi inte behöver mejla varje år?',
                  '',
                  'Tack på förhand!',
                  '//Emmaboda GK',
                ],
              },
              season: {
                date: `1 mars ${year}`,
                title: `Ask ChargeNode to raise the chargers to 63 A (43.5 kW) from 1 Mar ${year}`,
                mail: [
                  'Hej Jonathan,',
                  '',
                  `Inför golfsäsongen vill vi från och med den 1 mars ${year} höja laddarna igen till 63 A (43,5 kW), som förra säsongen.`,
                  'Den 26 oktober vill vi sedan som vanligt gå tillbaka till 36 A totalt (≈ 25 kW) för hela anläggningen.',
                  '',
                  'Går det att lägga in detta som ett återkommande schema så att vi inte behöver mejla varje år?',
                  '',
                  'Tack på förhand!',
                  '//Emmaboda GK',
                ],
              },
            }[which];

            const label = 'chargenode-season';
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'fbca04', description: 'Yearly reminder to switch the ChargeNode limit' });
            } catch (err) {
              if (err.status !== 422) throw err; // already exists
            }
            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 20 });
            if (open.some((i) => i.title === plan.title)) {
              core.info('Reminder already open.');
              return;
            }
            const body = [
              `The yearly plan switches the ChargeNode load balancing on **${plan.date}**. Send this to ChargeNode (support@chargenode.eu):`,
              '',
              '```text',
              ...plan.mail,
              '```',
              '',
              '- [ ] E-mail sent to ChargeNode',
              '- [ ] ChargeNode confirmed the new setting',
              '- [ ] If they switch on a different date, add it as a row to `LIMIT_HISTORY` in `public/analysis.js` so the dashboard draws the real date',
              '',
              'The dashboard already assumes the plan (`SEASON_PLAN` in `public/analysis.js`); close this issue once ChargeNode has confirmed.',
            ].join('\n');
            const create = (assignees) => github.rest.issues.create({ owner, repo, title: plan.title, body, labels: [label], assignees });
            let issue;
            try {
              issue = (await create([owner])).data;
            } catch (err) {
              if (err.status !== 422) throw err;
              issue = (await create([])).data;
            }
            core.notice(`Opened ${issue.html_url}`);
